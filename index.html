<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyClawd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f5; --card:#fff; --ink:#1f1e1d; --muted:#6b6a68; --line:#e8e6dc; --stage:#dddcd7; --accent:#d4845a; /* Clawd coral */ }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1918; --card:#262523; --ink:#f0eee6; --muted:#9a9890; --line:#383632; --stage:#3f3e3b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif; }
  .head { max-width:1100px; margin:0 auto 24px; display:flex; flex-wrap:wrap; gap:24px; justify-content:space-between; align-items:flex-start; }
  .head > div:first-child { flex:1 1 420px; }
  .head .hero { flex:none; width:176px; }  /* GIF shown at 160px, smaller than the cards */
  .hero img { width:100%; display:block; image-rendering:pixelated; }
  h1 { margin:0 0 16px; font:400 24px/1.2 'Press Start 2P',ui-monospace,monospace; color:var(--accent); text-shadow:3px 3px 0 var(--line); }
  .sub { margin:0; color:var(--muted); font-size:15px; line-height:1.5; }
  .sub strong { color:var(--ink); }
  main { max-width:1100px; margin:0 auto; }
  h2 { margin:32px 0 12px; font-size:16px; font-weight:600; color:var(--muted); }
  section { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .stage { border:0; cursor:zoom-in; display:block; }
  .stage { width:100%; background:var(--stage); border-radius:8px; padding:8px; }  /* mid grey: white and dark animations both stay visible */
  .card img { width:100%; image-rendering:pixelated; }
  .row { width:100%; display:flex; justify-content:space-between; align-items:center; }
  .name { font-size:15px; font-weight:600; text-transform:capitalize; }
  dialog { border:0; padding:0; background:transparent; max-width:none; max-height:none; overflow:visible; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .box { position:relative; background:var(--card); color:var(--ink); border-radius:16px; padding:56px 24px 24px; width:min(92vw,760px); }
  .box .stage { cursor:default; padding:16px; }
  .box img { width:100%; image-rendering:pixelated; display:block; }
  .box h3 { margin:16px 0 0; font-size:18px; text-transform:capitalize; }
  .x { position:absolute; top:8px; right:8px; width:36px; height:36px; border:0; border-radius:8px; background:none; color:var(--muted); font-size:24px; line-height:1; cursor:pointer; }
  .x:hover, .x:focus-visible { background:var(--line); color:var(--ink); outline:none; }
  .desc { color:var(--muted); font-size:13px; }
  a.dl { display:grid; place-items:center; width:36px; height:36px; border-radius:8px; color:var(--ink); border:1px solid var(--line); }
  a.dl:hover, a.dl:focus-visible { background:var(--accent); border-color:var(--accent); color:#fff; outline:none; }
</style>
</head>
<body>
<header class="head"><div><h1>MyClawd</h1>
<p class="sub"><strong>Seamless GIFs with multiple loops.</strong> Every set starts and ends on the same base pose, so you can switch from any GIF to any other, any time, without a jump: exit, enter, loop.</p></div>
<div class="stage hero" id="hero" aria-label="Clawd demo: random sets played seamlessly"></div></header>
<main id="grid"></main>
<dialog id="dlg"><div class="box"><button class="x" aria-label="Close">&times;</button>
  <div class="stage"><img id="big" alt=""></div><h3 id="bigname"></h3><div class="desc" id="bigdesc"></div></div></dialog>
<script src="sets.js"></script>
<script>
const svg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>';
const card = n => `
  <div class="card">
    <button class="stage" data-set="${n}" aria-label="Enlarge ${n}"><img src="sets/${n}/full.gif" alt="${n}" loading="lazy"></button>
    <div class="row"><div><div class="name">${n.replace(/-/g, ' ')}</div><div class="desc">${DESC[n] || ''}</div></div>
    <a class="dl" href="zips/${n}.zip" download title="Download ${n} (full, enter, exit, all loops)" aria-label="Download ${n}">${svg}</a></div>
  </div>`;
document.getElementById('grid').innerHTML = GROUPS.map(g => `<h2>${g.title}</h2><section>${g.sets.map(card).join('')}</section>`).join('');
// header demo: enter -> one random loop variant -> exit, then a different random set, all seamless
const hero = document.getElementById('hero'), sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
async function show(url) {  // fresh <img> per play so the GIF restarts at frame 0
  const im = new Image(); im.src = url; await im.decode().catch(() => {});
  hero.replaceChildren(im);
}
async function demo() {
  const names = Object.keys(PLAY); let cur = '';
  while (true) {
    do { cur = pick(names); } while (cur === prev && names.length > 1);
    prev = cur; const p = PLAY[cur], [lf, lms] = pick(p.loops), dir = `sets/${cur}/`;
    await show(dir + 'enter.gif'); await sleep(p.enter);
    await show(dir + lf); await sleep(lms * Math.max(1, Math.round(3000 / lms)));  // whole loops, about 3 s
    await show(dir + 'exit.gif'); await sleep(p.exit);
  }
}
let prev = ''; demo();

const dlg = document.getElementById('dlg');
document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.stage'); if (!b) return;
  const n = b.dataset.set;
  document.getElementById('big').src = `sets/${n}/full.gif`;
  document.getElementById('bigname').textContent = n.replace(/-/g, ' ');
  document.getElementById('bigdesc').textContent = DESC[n] || '';
  dlg.showModal();
});
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('.x')) dlg.close(); });  // dialog has no padding, so a hit on it itself is the backdrop; Esc is built in
</script>
</body>
</html>
